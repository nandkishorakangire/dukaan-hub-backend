services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukaanhub
      POSTGRES_PASSWORD: dukaanhub
      POSTGRES_DB: dukaanhub
    ports:
      - '5432:5432'
    volumes:
      - dukaanhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dukaanhub -d dukaanhub']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://dukaanhub:dukaanhub@db:5432/dukaanhub?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-characters}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-characters}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-me-webhook-secret}
      PUBLIC_BASE_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
    ports:
      - '4000:4000'
    volumes:
      - dukaanhub-uploads:/app/uploads

volumes:
  dukaanhub-pgdata:
  dukaanhub-uploads:
